name: Deploy LingoMate to Home Server

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: lingomate-home-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on:
      - self-hosted
      - Linux
      - X64
      - lingomate
    timeout-minutes: 10
    steps:
      - name: Deploy LingoMate
        run: /home/royyan/deploy-lingomate.sh
